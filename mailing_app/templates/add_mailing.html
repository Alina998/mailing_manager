{% extends 'base.html' %}

{% block title %}Добавить рассылку{% endblock %}

{% block content %}
    <h1>Создать новую рассылку</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить рассылку</button>
    </form>
{% endblock %}
