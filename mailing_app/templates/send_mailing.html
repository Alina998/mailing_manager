{% extends 'base.html' %}

{% block title %}Запуск рассылки{% endblock %}

{% block content %}
    <h1>Запуск рассылки: {{ mailing.message.subject }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Запустить рассылку</button>
    </form>
    <a href="/mailing_info/">Назад</a>
{% endblock %}
